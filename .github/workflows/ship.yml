name: ship

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/keepalive'
      - '.github/workflows/ping.yml'
      - '.github/workflows/keepalive.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-build-deploy:
    # One job, one checkout, one build folder: the tests run on exactly what is deployed.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to ship if the plan or the progress log is tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(PLAN|PROGRESS)\.md$'; then
            echo "PLAN.md or PROGRESS.md is tracked in this repository. Refusing to ship."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=unit-results.json
          echo "UNIT_TESTS=$(node scripts/unit-count.mjs unit-results.json)" >> "$GITHUB_ENV"

      - name: Wording and catalogue documents in sync with the app
        run: |
          node scripts/anchors-md.mjs --check
          node scripts/catalogue-md.mjs --check

      - name: Build, stamped with this commit and this run
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_UNIT_TESTS: ${{ env.UNIT_TESTS }}
        run: npm run build

      - name: Install the phone browser
        run: npx playwright install --with-deps chromium

      - name: Phone smoke test against the built folder
        run: npx playwright test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
