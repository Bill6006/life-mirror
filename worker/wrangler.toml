# The brain: a Worker under your own Cloudflare account, on the free tier. Deployed by you with
# `npm run worker:deploy` after `npx wrangler login`. Its secrets are pasted by you with
# `npx wrangler secret put NAME --config worker/wrangler.toml` and never appear here, in source,
# in tests, in the pipeline or in logs: TURSO_TOKEN, PUSH_SUBSCRIPTION, VAPID_PRIVATE_KEY, RUN_KEY,
# CLAUDE_BRIDGE_KEY, CLAUDE_FIRE_TOKEN.
name = "life-mirror-brain"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[triggers]
# One tick every fifteen minutes (Part 28): a cue whose moment has come and the three check-in
# pings at their times; the day's line once today's sheet carries the morning check-in, or from
# FALLBACK_TIME without one; on Sunday at BRIEF_HOUR, the week reviewed.
crons = ["*/15 * * * *"]

[vars]
TIMEZONE = "America/New_York"
# The Sunday review's hour, local.
BRIEF_HOUR = "5"
# With no morning check-in on a sheet by this local time, the day's line is written from the newest sheet.
FALLBACK_TIME = "11:00"
# The content-free check-in pings, local time; the phone decides whether to show anything.
PING_TIMES = "07:30,13:00,19:30"
# The database address is a constant shown in Settings, not a secret; the token is.
TURSO_URL = "https://life-record-bill6006.aws-us-east-1.turso.io"
LIBRARY_URL = "https://raw.githubusercontent.com/Bill6006/life-mirror/main/src/library.json"
CATALOGUE_URL = "https://raw.githubusercontent.com/Bill6006/life-mirror/main/src/catalogue.json"
# The bridge's routine (Parts 29 and 30). Its fire URL is an address, not a secret; the routine's
# token is, and nothing fires without it.
CLAUDE_FIRE_URL = "https://api.anthropic.com/v1/claude_code/routines/trig_01RQ3fd2bQh64dA2hx963dh3/fire"
# Claude writes the day's line and the Sunday review (Part 30, the owner's word 2026-09-23); "off"
# returns the writing to the free model chain alone. Every fallback stays either way.
CLAUDE_WRITER = "on"
# No valid line from Claude within this many minutes, and the free chain writes at the next tick.
CLAUDE_TIMEOUT_MINUTES = "20"
# The coach (Part 32): on, it runs once a day, after the day's line. On from its launch day (the
# owner's word, 2026-09-23) and watched every day after it, from the bridge's own rows. A day whose
# line broke a safety condition, Claude's own line on fewer than seven of ten scheduled days, no
# three days in a row of it among the first five, or a spot-check that found a key turns it off and
# takes back that day's pick, so Part 24's pick stands, until ten consecutive scheduled clean days
# after the failure, Claude's own line on seven of them, and the latest spot-check clean. "off"
# keeps Part 24's pick alone; with no launch day, the ten-day check alone switches it on.
COACH_WRITER = "on"
COACH_LAUNCH = "2026-09-23"
VAPID_PUBLIC_KEY = "BCaIRco378dsKVVBh0-wIIWYUqrTgY2aZuJA_uxEXnyojXNoZrYlsszUH3QzecsMBdvMCzXEw9ihMnf219GCNOA"
VAPID_SUBJECT = "https://github.com/Bill6006/life-mirror"
# In order; every failure falls to the next. All four answer on the free plan (DeepSeek does not;
# Gemma 4 and Qwen 3 spend the whole budget thinking). Prices are on developers.cloudflare.com/workers-ai.
MODELS = "@cf/openai/gpt-oss-120b,@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-4-scout-17b-16e-instruct,@cf/openai/gpt-oss-20b"
