# The brain: a Worker under your own Cloudflare account, on the free tier. Deployed by you with
# `npm run worker:deploy` after `npx wrangler login`. Its secrets are pasted by you with
# `npx wrangler secret put NAME --config worker/wrangler.toml` and never appear here, in source,
# in tests, in the pipeline or in logs: TURSO_TOKEN, PUSH_SUBSCRIPTION, VAPID_PRIVATE_KEY, RUN_KEY.
name = "life-mirror-brain"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[triggers]
# The morning line at 05:15 America/New_York: 09:15 UTC in summer, 10:15 UTC in winter; the code
# checks the local hour and the other firing does nothing. Every fifteen minutes: a cue whose
# moment has come, and the three check-in pings at their times.
crons = ["15 9 * * *", "15 10 * * *", "*/15 * * * *"]

[vars]
TIMEZONE = "America/New_York"
BRIEF_HOUR = "5"
# The content-free check-in pings, local time; the phone decides whether to show anything.
PING_TIMES = "07:30,13:00,19:30"
# The database address is a constant shown in Settings, not a secret; the token is.
TURSO_URL = "https://life-record-bill6006.aws-us-east-1.turso.io"
LIBRARY_URL = "https://raw.githubusercontent.com/Bill6006/life-mirror/main/src/library.json"
VAPID_PUBLIC_KEY = "BCaIRco378dsKVVBh0-wIIWYUqrTgY2aZuJA_uxEXnyojXNoZrYlsszUH3QzecsMBdvMCzXEw9ihMnf219GCNOA"
VAPID_SUBJECT = "https://github.com/Bill6006/life-mirror"
# In order; every failure falls to the next. All four answer on the free plan (DeepSeek does not;
# Gemma 4 and Qwen 3 spend the whole budget thinking). Prices are on developers.cloudflare.com/workers-ai.
MODELS = "@cf/openai/gpt-oss-120b,@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-4-scout-17b-16e-instruct,@cf/openai/gpt-oss-20b"
