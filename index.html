<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d111d" />
    <!-- The chosen theme, before the first paint: the same key and the same three names as src/theme.ts; anything else is Nocturne. -->
    <script>
      (function () {
        var grounds = { nocturne: "#0d111d", instrument: "#14171f", signal: "#0a0c0f" }
        var t = "nocturne"
        try {
          var v = localStorage.getItem("life-mirror.theme")
          if (v && Object.prototype.hasOwnProperty.call(grounds, v)) t = v
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute("content", grounds[t])
      })()
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="How you are, read from your own record." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Life Mirror</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
